<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0e1a24">
<title>Helium Voice</title>
<style>
  :root {
    --bg: #eef5f9;
    --card: #ffffff;
    --text: #13232f;
    --muted: #5b6d7a;
    --accent: #1f9bd1;
    --accent-2: #7fd3f7;
    --rec: #e5484d;
    --track: #d4e2ea;
    --shadow: 0 10px 30px rgba(19, 35, 47, 0.12);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0e1a24;
      --card: #16252f;
      --text: #e6f1f7;
      --muted: #8fa5b3;
      --accent: #3bb4e8;
      --accent-2: #9be0ff;
      --rec: #ff6369;
      --track: #26394a;
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }
  }
  :root[data-theme="dark"] {
    --bg: #0e1a24; --card: #16252f; --text: #e6f1f7; --muted: #8fa5b3;
    --accent: #3bb4e8; --accent-2: #9be0ff; --rec: #ff6369; --track: #26394a;
    --shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex; justify-content: center;
    padding: max(24px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
  }
  main { width: 100%; max-width: 420px; display: flex; flex-direction: column; align-items: center; gap: 24px; }
  h1 { margin: 8px 0 0; font-size: 28px; letter-spacing: -0.02em; }
  .sub { margin: -16px 0 0; color: var(--muted); text-align: center; }

  #mic {
    position: relative;
    width: 180px; height: 180px; border-radius: 50%; border: 0;
    background: radial-gradient(circle at 35% 30%, var(--accent-2), var(--accent));
    color: #fff; box-shadow: var(--shadow);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
    font: inherit; font-size: 17px; font-weight: 600; cursor: pointer; touch-action: manipulation; user-select: none;
    transition: transform 0.1s ease;
  }
  #mic:active { transform: scale(0.96); }
  #mic svg { width: 56px; height: 56px; }
  #mic.recording { background: radial-gradient(circle at 35% 30%, #ff9a9d, var(--rec)); }
  #mic.recording::after {
    content: ""; position: absolute; inset: -10px; border-radius: 50%;
    border: 4px solid var(--rec); opacity: 0.5;
    transform: scale(var(--lvl, 1)); transition: transform 0.08s linear;
  }
  #mic:disabled { opacity: 0.6; }

  #status { min-height: 1.4em; color: var(--muted); text-align: center; }

  .row { display: flex; gap: 10px; width: 100%; }
  .row button {
    flex: 1; padding: 14px 8px; border-radius: 14px; border: 0;
    background: var(--card); color: var(--text); box-shadow: var(--shadow);
    font: inherit; font-size: 15px; font-weight: 600; line-height: 1; cursor: pointer;
  }
  .row button.primary { background: var(--accent); color: #fff; }
  .row button:disabled { opacity: 0.4; }

  .card { width: 100%; background: var(--card); border-radius: 18px; padding: 18px; box-shadow: var(--shadow); }
  label { display: block; font-weight: 600; margin-bottom: 4px; }
  label span { float: right; color: var(--muted); font-weight: 500; font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; accent-color: var(--accent); margin: 6px 0 16px; }
  .card :last-child { margin-bottom: 0; }
  .hint { font-size: 13px; color: var(--muted); text-align: center; margin: 0; }
</style>
</head>
<body>
<main>
  <h1>Helium Voice</h1>
  <p class="sub">Tap, talk, tap again. Hear yourself on helium.</p>

  <button id="mic" aria-label="Start recording">
    <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/></svg>
    <span id="micLabel">Tap to talk</span>
  </button>

  <div id="status" role="status"></div>

  <div class="row">
    <button id="playFx" class="primary" disabled>▶ Helium</button>
    <button id="playOrig" disabled>▶ Original</button>
    <button id="save" disabled>Save</button>
  </div>

  <div class="card">
    <label for="formant">Helium amount <span id="formantVal"></span></label>
    <input id="formant" type="range" min="1" max="2.4" step="0.05" value="1.7">
    <label for="pitch">Pitch <span id="pitchVal"></span></label>
    <input id="pitch" type="range" min="0.8" max="1.8" step="0.05" value="1.15">
  </div>

  <p class="hint">Recordings stay on your phone. Nothing is uploaded.</p>
</main>

<script src="helium.js"></script>
<script>
(function () {
  'use strict';
  var MAX_SECONDS = 30;

  var $ = function (id) { return document.getElementById(id); };
  var micBtn = $('mic'), micLabel = $('micLabel'), statusEl = $('status');
  var playFx = $('playFx'), playOrig = $('playOrig'), saveBtn = $('save');
  var formant = $('formant'), pitch = $('pitch');

  var ctx = null, stream = null, source = null, proc = null, chunks = [];
  var recording = false, startedAt = 0, timer = null;
  var raw = null, rawLoud = null, rate = 48000, fx = null, fxKey = '';
  // Playback goes through an <audio> element, not Web Audio: iOS mutes Web Audio
  // when the ringer switch is on silent, but plays media elements regardless.
  var audioEl = new Audio(), audioUrl = null, audioLabel = '';
  audioEl.setAttribute('playsinline', '');
  audioEl.onended = function () { if (audioLabel && !recording) setStatus('Tap ▶ to hear it again.'); };
  audioEl.onplaying = function () { if (audioLabel) setStatus('Playing ' + audioLabel + '…'); };

  function setAudioSession(type) {
    try { if (navigator.audioSession) navigator.audioSession.type = type; } catch (e) {}
  }

  function showVals() {
    $('formantVal').textContent = '×' + Number(formant.value).toFixed(2);
    $('pitchVal').textContent = '×' + Number(pitch.value).toFixed(2);
  }
  formant.oninput = pitch.oninput = showVals;
  formant.onchange = pitch.onchange = function () { if (raw) playProcessed(); };
  showVals();

  function setStatus(s) { statusEl.textContent = s; }

  function getCtx() {
    if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
    return ctx;
  }

  async function startRecording() {
    stopPlayback();
    // Play a silent clip inside this tap so iOS lets us autoplay the result later.
    audioLabel = '';
    audioEl.src = toWavUrl(new Float32Array(800), 8000);
    audioEl.play().catch(function () {});
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      setStatus('This browser can’t use the microphone. The page must be opened over https.');
      return;
    }
    var ac = getCtx();
    await ac.resume();
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        audio: { echoCancellation: false, noiseSuppression: true, autoGainControl: true }
      });
    } catch (e) {
      setStatus('Microphone blocked. Allow mic access for this site and try again.');
      return;
    }
    rate = ac.sampleRate;
    chunks = [];
    source = ac.createMediaStreamSource(stream);
    proc = ac.createScriptProcessor(4096, 1, 1);
    proc.onaudioprocess = function (e) {
      var d = e.inputBuffer.getChannelData(0);
      chunks.push(new Float32Array(d));
      e.outputBuffer.getChannelData(0).fill(0);
      var s = 0;
      for (var i = 0; i < d.length; i += 8) s += d[i] * d[i];
      var lvl = Math.min(1, Math.sqrt(s / (d.length / 8)) * 6);
      micBtn.style.setProperty('--lvl', (1 + lvl * 0.25).toFixed(3));
    };
    source.connect(proc);
    proc.connect(ac.destination);

    recording = true;
    startedAt = Date.now();
    micBtn.classList.add('recording');
    micBtn.setAttribute('aria-label', 'Stop recording');
    micLabel.textContent = 'Tap to stop';
    timer = setInterval(function () {
      var secs = (Date.now() - startedAt) / 1000;
      setStatus('Recording… ' + secs.toFixed(0) + 's');
      if (secs >= MAX_SECONDS) stopRecording();
    }, 200);
    setStatus('Recording… 0s');
  }

  function stopRecording() {
    if (!recording) return;
    recording = false;
    clearInterval(timer);
    source.disconnect();
    proc.disconnect();
    proc.onaudioprocess = null;
    // Releasing the mic lets iOS route playback to the loudspeaker, not the earpiece.
    stream.getTracks().forEach(function (t) { t.stop(); });
    if (ctx) { ctx.close().catch(function () {}); ctx = null; }
    setAudioSession('playback');
    micBtn.classList.remove('recording');
    micBtn.setAttribute('aria-label', 'Start recording');
    micLabel.textContent = 'Tap to talk';

    var len = chunks.reduce(function (n, c) { return n + c.length; }, 0);
    if (len < rate * 0.3) { setStatus('Too short. Tap and say something!'); return; }
    raw = new Float32Array(len);
    var off = 0;
    chunks.forEach(function (c) { raw.set(c, off); off += c.length; });
    chunks = [];
    fx = null; fxKey = ''; rawLoud = null;
    playFx.disabled = playOrig.disabled = saveBtn.disabled = false;
    setStatus('Adding helium…');
    processed();
    // Give iOS a moment to release the mic and switch back to the loudspeaker.
    setTimeout(playProcessed, 400);
  }

  function processed() {
    var key = formant.value + '|' + pitch.value;
    if (!fx || fxKey !== key) {
      fx = Helium.helium(raw, rate, { formant: Number(formant.value), pitch: Number(pitch.value) });
      fxKey = key;
    }
    return fx;
  }

  function stopPlayback() {
    audioEl.pause();
  }

  function toWavUrl(samples, sr) {
    if (audioUrl) URL.revokeObjectURL(audioUrl);
    audioUrl = URL.createObjectURL(toWav(samples, sr));
    return audioUrl;
  }

  // Called synchronously from taps so iOS treats playback as user-initiated.
  function play(samples, label) {
    stopPlayback();
    audioLabel = label;
    audioEl.src = toWavUrl(samples, rate);
    audioEl.play().catch(function () { setStatus('Tap ▶ Helium to play.'); });
  }

  function playProcessed() {
    play(processed(), 'helium voice');
  }

  function toWav(samples, sr) {
    var buf = new ArrayBuffer(44 + samples.length * 2), v = new DataView(buf);
    function str(o, s) { for (var i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); }
    str(0, 'RIFF'); v.setUint32(4, 36 + samples.length * 2, true); str(8, 'WAVE');
    str(12, 'fmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
    v.setUint32(24, sr, true); v.setUint32(28, sr * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true);
    str(36, 'data'); v.setUint32(40, samples.length * 2, true);
    for (var i = 0; i < samples.length; i++) {
      var s = Math.max(-1, Math.min(1, samples[i]));
      v.setInt16(44 + i * 2, s < 0 ? s * 0x8000 : s * 0x7fff, true);
    }
    return new Blob([buf], { type: 'audio/wav' });
  }

  async function save() {
    var blob = toWav(processed(), rate);
    var file = new File([blob], 'helium-voice.wav', { type: 'audio/wav' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file], title: 'Helium voice' }); return; }
      catch (e) { if (e.name === 'AbortError') return; }
    }
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = file.name;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 5000);
  }

  micBtn.onclick = function () { recording ? stopRecording() : startRecording(); };
  playFx.onclick = playProcessed;
  playOrig.onclick = function () {
    if (!rawLoud) rawLoud = Helium.loudness(raw, rate);
    play(rawLoud, 'original');
  };
  saveBtn.onclick = save;
})();
</script>
</body>
</html>
